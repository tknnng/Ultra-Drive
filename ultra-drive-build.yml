name: Build Ultra Drive APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project files from repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Ultra Drive project
        run: |
          mkdir source
          unzip -q Ultra-Drive-Android-Project.zip -d source

      - name: Build debug APK
        run: gradle -p source :app:assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Drive-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
